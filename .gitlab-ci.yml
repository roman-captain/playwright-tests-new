stages:
  - test
  - report

aqa-tests:
  stage: test
  image: node:20
  script:
    - npm ci
    - npx playwright install --with-deps chromium
    - npm run test
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 10 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

generate-report:
  stage: report
  image: node:20
  script:
    - npm ci
    - npx allure generate allure-results --clean -o allure-report
  artifacts:
    when: always
    paths:
      - allure-report/
    expire_in: 10 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
